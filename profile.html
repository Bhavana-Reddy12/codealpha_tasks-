<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Connectly</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">Connectly</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="feed.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="search.html">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="notifications.html">Notifications</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="edit-profile.html">Edit Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <img src="" alt="Profile Image" class="card-img-top" id="profileImage">
                    <div class="card-body">
                        <h5 class="card-title" id="profileName"></h5>
                        <h6 class="card-subtitle mb-2 text-muted" id="profileUsername"></h6>
                        <p class="card-text" id="profileBio"></p>
                        <p><strong>Followers:</strong> <span id="followersCount"></span></p>
                        <p><strong>Following:</strong> <span id="followingCount"></span></p>
                        <p><strong>Posts:</strong> <span id="postsCount"></span></p>
                        <button class="btn btn-primary" id="followButton"></button>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <h3>User Posts</h3>
                <div id="userPosts"></div>
            </div>
        </div>
    </div>

    <script src="js/profile.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
